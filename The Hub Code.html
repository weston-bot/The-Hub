<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#14212B; --muted:#586775; --line:#D6DDE4;
  --accent:#0E5FA3; --accent-ink:#FFFFFF; --accent-soft:#E1ECF7;
  --heat:#B8430F; --heat-soft:#FBE9DF; --ok:#1F7A4D; --ok-soft:#DFF2E7;
  --note:#FFF7DC; --note-line:#E8D48F; --note-ink:#6B5410;
  --plum:#6A3E9E; --plum-soft:#EFE7F8;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D141A; --surface:#152029; --surface-2:#1A2731; --ink:#E4EBF0; --muted:#93A3B1; --line:#263541;
    --accent:#5BA8EE; --accent-ink:#06121C; --accent-soft:#16304A;
    --heat:#F08A52; --heat-soft:#3A2116; --ok:#5CC98F; --ok-soft:#16321F; --note:#2B2614; --note-line:#5C4F22; --note-ink:#E8CF7A; --plum:#C3A3EE; --plum-soft:#2B2140;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D141A; --surface:#152029; --surface-2:#1A2731; --ink:#E4EBF0; --muted:#93A3B1; --line:#263541;
  --accent:#5BA8EE; --accent-ink:#06121C; --accent-soft:#16304A;
  --heat:#F08A52; --heat-soft:#3A2116; --ok:#5CC98F; --ok-soft:#16321F; --note:#2B2614; --note-line:#5C4F22; --note-ink:#E8CF7A; --plum:#C3A3EE; --plum-soft:#2B2140;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:22px 16px;display:grid;gap:14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-stretch:78%;font-weight:800;font-size:34px;letter-spacing:-.01em;margin:0;line-height:1}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:13.5px}
.search{position:relative}
.search input{width:100%;font:500 18px/1.3 var(--body);color:var(--ink);background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:15px 120px 15px 46px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .ask{position:absolute;right:7px;top:50%;transform:translateY(-50%);font:600 14px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.search .ask:focus-visible,.chip:focus-visible,.tab:focus-visible,.seg button:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.search input{padding-right:16px;font-size:16px}.search .ask{position:static;transform:none;margin-top:8px;width:100%}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:500 13px var(--body);background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.lbl{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 12.5px var(--body);background:var(--surface);color:var(--muted);border:0;border-right:1px solid var(--line);padding:6px 11px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tabs{display:grid;gap:7px;margin-top:4px;padding-bottom:2px}
.tgrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tglabel{flex:0 0 172px;white-space:nowrap;font:700 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tab{font:600 14px var(--body);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:7px 13px;cursor:pointer;white-space:nowrap;line-height:1.2}
.tab:hover{color:var(--ink);border-color:var(--muted)}
.tab[aria-selected="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.tab[aria-selected="true"] .badge{background:#fff;color:var(--heat)}
.tgrow.cur .tglabel{color:var(--tc);text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){
  .tabs{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin;padding-bottom:8px;margin-inline:-16px;padding-inline:16px;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent 100%)}
  .tgrow{display:contents}
  .tglabel{flex:none;font-size:10px;padding-left:10px;margin-left:4px;border-left:1px solid var(--line);white-space:nowrap}
  .tgrow:first-child .tglabel{display:none}
  .tab{scroll-snap-align:start}
}


/* row colors */
.tgrow{--tc:var(--muted);--tcs:var(--surface-2)}
.tgrow.tg0{--tc:var(--ink);--tcs:var(--surface-2)}
.tgrow.tg1{--tc:var(--accent);--tcs:var(--accent-soft)}
.tgrow.tg2{--tc:var(--plum);--tcs:var(--plum-soft)}
.tgrow.tg3{--tc:var(--ok);--tcs:var(--ok-soft)}
.tgrow.tg4{--tc:var(--heat);--tcs:var(--heat-soft)}
.tgrow .tglabel{color:var(--tc)}
.tgrow .tab{color:var(--tc);background:var(--tcs);border-color:transparent}
.tgrow .tab:hover{border-color:var(--tc);color:var(--tc)}
.tgrow .tab[aria-selected="true"]{background:var(--tc);border-color:var(--tc);color:var(--surface)}
.tgrow.tg0 .tab{border-color:var(--line)}

main .wrap{padding-block:22px 60px;display:grid;gap:22px}
h2{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-stretch:90%;font-weight:700;font-size:16.5px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.stack{display:grid;gap:12px;align-content:start}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* answer */
.answer{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:16px 18px}
.answer .body{max-width:70ch}
.answer .body p{margin:.3em 0}
.answer .body ul{margin:.3em 0;padding-left:1.2em}
.answer .head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.zipcard{border-left:5px solid var(--ok);background:var(--surface);border-radius:var(--r);padding:14px 18px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.zipcard.no{border-left-color:var(--heat)}
.zipcard .big{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:22px}

/* results */
.results{display:grid;gap:10px}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;display:grid;gap:4px}
.hit .t{font-weight:600;font-size:15.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hit .t a{text-decoration:none}
.hit .t a:hover{text-decoration:underline}
.hit .d{color:var(--ink);white-space:pre-line;max-width:80ch}
.kind{font:600 10.5px var(--body);letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.kind.person{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.kind.link{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.kind.faq{background:var(--heat-soft);color:var(--heat);border-color:transparent}
mark{background:transparent;color:inherit;box-shadow:inset 0 -.45em 0 var(--accent-soft);font-weight:600}
.phone{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13.5px}
.copy{font:600 11px var(--body);border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:6px;padding:2px 7px;cursor:pointer}
.phone .copy{flex:none}
.copy.done{color:var(--ok);border-color:var(--ok)}

/* tables & lists */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.who{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;font-size:14px}
.who dt{color:var(--muted)}
.who dd{margin:0;font-weight:600}
.oncall{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.slot{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface-2)}
.slot .r{font-size:12px;color:var(--muted)}
.slot .n{font-weight:600}
.slot.none .n{color:var(--heat)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{font:600 12.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.faqcat{display:grid;gap:8px}
.faqcat ul{margin:0;padding-left:1.1em;display:grid;gap:8px}
.faqcat li{white-space:pre-line}
.linkgroup ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.linkgroup li a{display:block;padding:5px 0;text-decoration:none;border-bottom:1px dashed var(--line)}
.linkgroup li a:hover{text-decoration:underline}
.people-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;display:grid;gap:3px}
.pcard .nm{font-weight:700}
.pcard .rl{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font:600 11px var(--body);padding:2px 8px;border-radius:999px;background:var(--heat-soft);color:var(--heat)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.empty{color:var(--muted);padding:10px 0}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.fld{display:grid;gap:5px;align-content:start}
.fld[data-for*="process"]:has(#ed_body),.fld:has(#ed_body){grid-column:1/-1}
.fld label{font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:15px/1.4 var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.fld .check{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font:500 14px var(--body);color:var(--ink)}
.fld .check input{width:auto}
.btn{font:600 14px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chglist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.chglist.pinned{padding:12px;border-radius:8px;background:var(--accent-soft)}
.chg{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.kind.update{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.left-flag{font-weight:500;color:var(--heat);font-size:12.5px}

.foot{color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:no-preference){.hit,.answer{animation:in .18s ease-out}@keyframes in{from{transform:translateY(3px)}to{transform:none}}}

.sr{position:absolute;left:-9999px}
.between{justify-content:space-between}
.sech{font-size:26px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start}
.cards.people{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media (max-width:480px){.cards,.cards.people{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;min-width:0;scroll-margin-top:12px}
.card.editing{border-color:var(--accent);grid-column:1/-1}
.card .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .t h3{font-size:16px}
.card .t a{text-decoration:none}.card .t a:hover{text-decoration:underline}
.card .mk{margin-left:auto}
.body p,.abody p{margin:.15em 0}
.body ul,.abody ul{margin:.25em 0;padding-left:1.15em;display:grid;gap:4px}
.body .tbl,.abody .tbl{margin:.4em 0}
.body{font-size:14.5px;overflow-wrap:anywhere}
p.today{background:var(--accent-soft);border-radius:5px;padding:2px 6px;margin-inline:-6px;font-weight:600}
.brk{word-break:break-all}
.edrow{display:flex;gap:10px;align-items:center;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px;flex-wrap:wrap;min-width:0}
.linkbtn{font:600 12.5px var(--body);color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul.links{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 20px}
ul.links li{padding:6px 0;border-bottom:1px dashed var(--line)}
ul.links a{text-decoration:none;font-weight:500}ul.links a:hover{text-decoration:underline}
.updbox{border-color:var(--accent)}
.updbox textarea{font:15px/1.45 var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;resize:vertical}
.updbox textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.proposal{border-top:1px solid var(--line);padding-top:12px}
.op{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:var(--surface-2)}
table.diff td{white-space:pre-line;font-size:13px}
table.diff th{width:1%}
.old{color:var(--heat);text-decoration:line-through;text-decoration-thickness:1px}
.new{color:var(--ok)}
.check{display:flex;gap:8px;align-items:center}
.btn.danger{color:var(--heat);border-color:var(--heat)}
.fld.wide{grid-column:1/-1}
.fld textarea{font:14px/1.45 var(--mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
.chglist li{display:grid;gap:1px}
pre{white-space:pre-wrap;overflow-x:auto;margin:0}
/* calendar view for month schedules */
.card.cal{grid-column:1/-1}
.calmonth{display:grid;gap:8px}
.calmonth + .calmonth{margin-top:10px}
.calhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.calhead .lbl{font-size:11.5px}
.calscroll{overflow-x:auto}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.calgrid .dow{background:var(--surface-2);font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:7px 9px}
.calday{background:var(--surface);min-height:104px;padding:7px 9px 9px;display:flex;flex-direction:column;gap:4px;min-width:0}
.calday .shifts{display:grid;gap:4px;min-width:0}
.calday.blank{background:var(--surface-2)}
.calday.wknd{background:color-mix(in srgb,var(--surface) 70%,var(--surface-2))}
.calday.past{opacity:.62}
.calday .dn{display:flex;gap:6px;align-items:baseline;font:600 12.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.calday .dn .wd{display:none;font-family:var(--body);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.calday.today{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);opacity:1}
.calday.today .dn{color:var(--accent)}
.calday.today .dn::after{content:"Today";font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 5px;margin-left:auto}
.shift{font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
.shift b{font-weight:600}
.shift .h{color:var(--muted);font-size:11.5px;display:block}
.shift.open b{color:var(--heat)}
.shift.off b{color:var(--ink)}
.shift.off .h{display:inline;color:var(--heat);font-weight:600;margin-left:3px}
.shift.locked{font-size:11.5px;font-weight:700;color:#fff;background:var(--heat);border-radius:4px;padding:2px 6px;text-transform:uppercase;letter-spacing:.04em}
.shift.evt{font-size:11.5px;font-weight:600;color:var(--heat);background:var(--heat-soft);border-radius:4px;padding:2px 6px}
@media (max-width:760px){
  .calgrid{grid-template-columns:1fr}
  .calgrid .dow,.calday.blank{display:none}
  .calday.noff{display:none}
  .calday{min-height:0;flex-direction:row;align-items:flex-start;gap:10px;padding:9px 12px}
  .calday .dn{flex-direction:column;gap:0;flex:0 0 54px}
  .calday .shifts{flex:1;gap:3px}
  .calday .dn .wd{display:block}
  .calday.today .dn::after{margin:4px 0 0}
  .shift .h{display:inline;margin-left:4px}
}

/* breaks & lunches board */
.brk{display:grid;gap:14px}
.brkpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px}
.brknow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brknow .clock{font:700 13px var(--mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.brknow .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brknow .lbl{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pchip{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:3px 10px;font:600 13px var(--body);border:1px solid transparent}
.pchip.lunch{background:var(--accent-soft);color:var(--accent)}
.pchip.break{background:var(--plum-soft);color:var(--plum)}
.pchip small{font:500 11.5px var(--mono);opacity:.85}
.brkleg{display:flex;gap:14px;font-size:12.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.brkleg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.brkleg i.l{background:var(--accent)} .brkleg i.b{background:var(--plum)}
.tl{display:grid;grid-template-columns:200px 1fr;gap:0}
.tl .hrs{position:relative;height:22px;border-bottom:1px solid var(--line)}
.tl .hrs span{position:absolute;top:2px;transform:translateX(-50%);font:600 11px var(--mono);color:var(--muted);white-space:nowrap}

mark.lrm{background:var(--note);color:inherit;border-radius:2px}

.mvrow select:focus-visible{outline:2px solid var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);font:600 14px var(--body);padding:10px 16px;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:20;max-width:calc(100% - 32px)}
.ghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.renform{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.renform input{font:700 20px var(--display);font-stretch:85%;color:var(--ink);background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:5px 10px;min-width:0;flex:1 1 240px;max-width:520px}
.renform input:focus{outline:none}
.renerr{color:var(--heat);font-size:13px;width:100%}
.card.hasnote .body{color:var(--heat);font-weight:600}
.card.zipcard2{grid-column:1/-1}
.card.zipinfo{grid-column:1/-1;justify-self:center;width:100%;max-width:560px}
.zipmeta{font-size:12.5px;color:var(--muted);margin-bottom:2px}
.zipnote{color:var(--heat);font-weight:600;max-width:75ch}
.ziplist{columns:230px auto;column-gap:26px;margin-top:4px}
.zrow{break-inside:avoid;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.zcity{font-weight:700;color:var(--accent);font-size:14.5px;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.zcity:hover{text-decoration:underline}
.zcity:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.zpin{opacity:.55;flex:none}
.zcity:hover .zpin{opacity:1}
.zzips{display:flex;flex-wrap:wrap;gap:4px}
.zip{font:600 12.5px var(--mono);font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:1px 6px}
.zip.hit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zarea{font:600 10.5px var(--body);letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;background:var(--za-bg);color:var(--za)}
.zarea.a0{--za:var(--accent);--za-bg:var(--accent-soft)}
.zarea.a1{--za:var(--ok);--za-bg:var(--ok-soft)}
.zarea.a2{--za:var(--heat);--za-bg:var(--heat-soft)}
.zarea.a3{--za:var(--plum);--za-bg:var(--plum-soft)}
/* pricing */
.cards.pricing{grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr))}
.cards > .card, .faqcol > .card{min-width:0;grid-template-columns:minmax(0,1fr)}
@media (max-width:480px){.cards.pricing{grid-template-columns:minmax(0,1fr)}}
.card.offerscard{grid-column:1/-1}
.offers{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-top:4px}
.offer{border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:11px 13px 12px;display:flex;flex-direction:column;gap:3px}
.offer .on{font-weight:700;font-size:14px;line-height:1.3}
.offer .ov{font:800 26px/1.1 var(--display);font-stretch:85%;color:var(--ok);font-variant-numeric:tabular-nums;margin-top:4px}
.offer .ov.word{font-size:21px}
.offer .od{font-size:13px;color:var(--muted);line-height:1.4}
.money{font:700 13.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--ok);background:var(--ok-soft);border-radius:5px;padding:0 5px;white-space:nowrap}
.pricecard td{font-variant-numeric:tabular-nums}
.pricecard td .money{background:none;padding:0;font-size:13.5px}
.pricecard tbody tr:nth-child(even) td{background:var(--surface-2)}
.pricecard td:first-child{font-weight:600}
.tcwrap{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;vertical-align:baseline}
.tccopy{padding:0 6px;font-size:10.5px;line-height:1.6}
.taskcode{font:600 12px var(--mono);background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 5px;white-space:nowrap}
.pricecard details summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px;padding:4px 0}
.pricecard details summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pricecard details[open] summary{margin-bottom:4px}
.pricecard .body > p:not(.today){margin:.3em 0}
/* FAQs */
.faqjump{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px}
.cards.faq{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
@media (max-width:520px){.cards.faq{grid-template-columns:1fr}}
.card.faqcallout{grid-column:1/-1;background:var(--heat-soft);border-color:color-mix(in srgb,var(--heat) 35%,var(--line))}
.card.faqcallout h3{color:var(--heat)}
.faqlist{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:9px}
.faqlist > li{position:relative;padding-left:16px;line-height:1.5}
.faqlist > li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.faqsub{list-style:none;margin:5px 0 0;padding:0 0 0 2px;display:grid;gap:4px;border-left:2px solid var(--line);padding-left:10px}
.faqsub li{font-size:14px;color:var(--ink)}
.faqsub .num{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 11px var(--body);margin-right:6px;vertical-align:1px}
.faqans{font-weight:700;color:var(--ok)}
.neg{color:var(--heat);font-weight:700}
.must{font-weight:800;color:var(--heat);letter-spacing:.01em}
.mkt{font:700 11px var(--body);border-radius:4px;padding:1px 6px;white-space:nowrap;background:var(--za-bg);color:var(--za)}
.mkt.LN{--za:var(--accent);--za-bg:var(--accent-soft)}
.mkt.LH{--za:var(--heat);--za-bg:var(--heat-soft)}
.mkt.SL{--za:var(--ok);--za-bg:var(--ok-soft)}
.mkt.ITA{--za:var(--plum);--za-bg:var(--plum-soft)}
.mkt.MCW{--za:var(--ink);--za-bg:var(--surface-2)}
.faqlink{font-weight:700}
.faqopen{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:6px 11px;text-decoration:none;align-self:start}
.faqopen:hover{text-decoration:underline}
.faqopen:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.faqblock + .faqblock{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.minihead{margin:0 0 7px;font:700 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:7px}
.minihead::after{content:"";flex:1;height:1px;background:var(--accent-soft)}
.body h4.minihead{margin-top:8px}
.cards.masoned{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cards.masoned > .card{flex:1 1 100%}
.faqcol{flex:1 1 0;min-width:0;display:grid;gap:12px;align-content:start}
/* generator flow helper */
.card.flowcard{grid-column:1/-1}
.genflow .card.flowcard{border:2px solid var(--accent)}
.flow{display:grid;gap:12px}
.flowm{display:flex;flex-wrap:wrap;gap:6px}
.flowm button{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.flowm button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.flowstage{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:16px 18px;display:grid;gap:12px}
.flowpath{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.flowpath .st{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.flowpath .st b{color:var(--ink)}
.flowq{font:700 22px/1.25 var(--display);font-stretch:88%;margin:0}
.flowbtns{display:flex;flex-wrap:wrap;gap:10px}
.flowbtns button{font:700 17px var(--body);min-width:120px;padding:12px 22px;border-radius:10px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
.flowbtns button:hover{background:var(--accent);color:var(--accent-ink)}
.flowbtns button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.flowout{border-radius:10px;padding:14px 16px;font:800 21px/1.3 var(--display);font-stretch:88%;display:flex;align-items:center;gap:10px}
.flowout .lbl{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.8;display:block;margin-bottom:2px}
.flowout.ok{background:var(--ok-soft);color:var(--ok);border:2px solid var(--ok)}
.flowout.wait{background:var(--note);color:var(--note-ink);border:2px solid var(--note-line)}
.flowout.stop{background:var(--heat-soft);color:var(--heat);border:2px solid var(--heat)}
.flowout.info{background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent)}
.flowctl{display:flex;gap:8px;flex-wrap:wrap}
.flowtree{margin:0;padding:0;list-style:none}
.flowtree ul{list-style:none;margin:4px 0 0 10px;padding-left:14px;border-left:2px solid var(--line);display:grid;gap:6px}
.flowtree .tq{font-weight:700}
.flowtree .ta{font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-right:6px;background:var(--surface-2);border:1px solid var(--line)}
.flowtree .to{font-weight:700;border-radius:5px;padding:1px 7px}
.flowtree .to.ok{background:var(--ok-soft);color:var(--ok)}
.flowtree .to.wait{background:var(--note);color:var(--note-ink)}
.flowtree .to.stop{background:var(--heat-soft);color:var(--heat)}
.flowtree .to.info{background:var(--accent-soft);color:var(--accent)}
.flowtrees{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.flowtrees h4{margin:0 0 6px;font:700 14px var(--body)}
.card.promolink{grid-column:1/-1;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.card.promolink .faqopen{background:var(--accent);color:var(--accent-ink)}
/* techs on-call board */
.ocwarn{border:1px solid var(--note-line);background:var(--note);color:var(--note-ink);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.ocboard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ocscroll{overflow-x:auto}
.octable{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;font-size:13.5px}
.octable th,.octable td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
.octable thead th{background:var(--surface-2);font:700 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.octable thead th .d{display:block;font:600 12px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink);margin-top:1px}
.octable th.role,.octable td.role{position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px;border-right:1px solid var(--line)}
.octable thead th.role{background:var(--surface-2)}
.octable td.role .rt{font-weight:700;font-size:14px;display:block}
.octable td.role .edit{margin-top:3px}
.octable tr.mkrow td{background:var(--surface-2);padding:6px 10px;font:700 11.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.octable tr.mkrow td .mkt{margin-right:6px}
.octable .today{background:var(--accent-soft)!important}
.octable thead th.today{color:var(--accent)}
.octable thead th.today .d{color:var(--accent)}
.octable thead th.today::after{content:"Today";display:block;font:700 10px var(--body);color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 5px;margin-top:3px;width:max-content}
.ocn{font-weight:600;display:block}
.ocnote{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.ocnone{font-weight:700;color:var(--heat)}
.ocnotes{grid-template-columns:1fr}
.ocnotes > .card{background:var(--heat-soft);border-color:color-mix(in srgb,var(--heat) 35%,var(--line))}
.ocnotes > .card h3{color:var(--heat)}
/* quiz */
.card.quizcard{grid-column:1/-1}
.quiz{display:grid;gap:12px;max-width:760px}
.qprog{display:flex;align-items:center;gap:10px;font:600 12.5px var(--body);color:var(--muted)}
.qbar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.qq{font:700 20px/1.3 var(--display);font-stretch:90%;margin:0}
.qopts{display:grid;gap:8px}
.qopt{text-align:left;font:500 15px/1.4 var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.qopt .ql{font:700 12px var(--body);min-width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none;margin-top:1px}
.qopt:disabled{cursor:default}
.qopt.right{border-color:var(--ok);background:var(--ok-soft)}
.qopt.right .ql{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.glrefs{display:grid;gap:14px;margin:4px 20px 6px}.glrefs .card{max-width:none}
.qopt.sel{border-color:var(--accent);background:var(--accent-soft)}
.qopt.sel .ql{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qopt.wrong{border-color:var(--heat);background:var(--heat-soft)}
.qopt.wrong .ql{background:var(--heat);color:var(--surface);border-color:var(--heat)}
.qfb{border-radius:10px;padding:10px 14px;font-size:14.5px}
.qfb.ok{background:var(--ok-soft);color:var(--ok)}
.qfb.no{background:var(--heat-soft);color:var(--heat)}
.qfb b{display:block;margin-bottom:2px}
.qfb span{color:var(--ink)}
.qscore{font:800 34px var(--display);font-stretch:85%;color:var(--accent);margin:0}
.qmiss,.body ul.qmiss{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.qmiss li{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--surface-2);font-size:14px}
.qmiss li b{display:block}
.qmiss .ca{color:var(--ok);font-weight:700}
/* quiz results (managers) */
.qname{display:grid;gap:6px;max-width:420px}
.qname label{font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.qname select{font:15px var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.qname select:focus-visible{outline:2px solid var(--accent)}
.qsaved{font-size:13.5px;font-weight:600;color:var(--ok)}
.qsaved.err{color:var(--heat)}
.qbanner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:600}
.qbanner .btn{padding:7px 12px;font-size:13px}
.tab .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:99px;background:var(--heat);color:#fff;font:700 11px var(--body);padding:0 5px;margin-left:5px;vertical-align:1px}
.qres{display:grid;gap:10px}
.qres .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.qres select{font:14px var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.qtable td,.qtable th{white-space:nowrap}
.qtable td.wrap{white-space:normal;min-width:220px}
.qpct{font:700 13px var(--mono);border-radius:5px;padding:1px 7px}
.qpct.hi{background:var(--ok-soft);color:var(--ok)}
.qpct.mid{background:var(--note);color:var(--note-ink)}
.qpct.lo{background:var(--heat-soft);color:var(--heat)}
.qnew{font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--heat);color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px}
.qtable tr.isnew td{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.qtable details summary{cursor:pointer;color:var(--accent);font-weight:600}
.qtable details ul{margin:6px 0 0;padding-left:1.1em;display:grid;gap:4px;font-size:13px}
/* CSR training path */
.tpath{display:grid;gap:14px}
.tpick{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
.tpick .qname{margin:0}
.tlevels{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tlevel{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:6px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.tlevel:hover:not(:disabled){border-color:var(--accent)}
.tlevel:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tlevel[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tlevel:disabled{cursor:default;opacity:.62}
.tlevel .tn{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tlevel .tt{font:700 16px/1.25 var(--display);font-stretch:90%}
.tstat{justify-self:start;font:700 11.5px var(--body);border-radius:99px;padding:2px 9px}
.tstat.locked{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tstat.ready{background:var(--accent-soft);color:var(--accent)}
.tstat.passed{background:var(--note);color:var(--note-ink)}
.tstat.done{background:var(--ok-soft);color:var(--ok)}
.tstat.fail{background:var(--heat-soft);color:var(--heat)}
.tmeta{font-size:12.5px;color:var(--muted)}
.card.lessoncard,.card.testcard{grid-column:1/-1}
.soff{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.soff li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.soff .bx{flex:none;width:18px;height:18px;border-radius:5px;border:2px solid var(--line);display:inline-grid;place-items:center;font:700 12px var(--body);margin-top:1px}
.soff li.ok .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.soff li .by{font-size:12px;color:var(--muted)}
.tprog td.cell{cursor:pointer}
.tprog td.cell:hover{background:var(--accent-soft)}
.tprog .cs{display:block;font-size:11.5px;color:var(--muted)}
.soedit{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;background:var(--accent-soft);display:grid;gap:8px}
.soedit label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.soedit input{margin-top:3px}
.mgmtnote{margin:-6px 0 0}
.whoblock .intro{max-width:75ch;color:var(--heat);font-weight:600}
.whoblock .people-grid{margin-top:6px}
.whoblock .pcard{background:var(--surface-2);gap:5px;align-content:start}
.whoblock .pcard .nm{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:15.5px}
.areas{display:flex;flex-wrap:wrap;gap:4px}
.area{font:600 11.5px var(--body);color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 7px;line-height:1.35}
.area.base{color:var(--ok);background:var(--ok-soft);font-weight:700}
.nocontact{font-size:12.5px;color:var(--muted);font-style:italic}
.rname .rph{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:12px;font-weight:500;color:var(--ink)}
.rname .rph .copy{padding:1px 5px;font-size:10px}
.rnone{font-size:13px;color:var(--muted);font-style:italic}

/* compact employee cards */
.cards.people{grid-auto-rows:auto;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.cards.people > .card:not(.editing){padding:9px 12px;gap:3px}
.cards.people > .card .t h3{font-size:15px}
.cards.people > .card .areas{align-items:center;gap:4px 8px}
.cards.people > .card .areas .phrs{font-size:12px}
.cards.people > .card .row{flex-direction:row;flex-wrap:wrap;align-items:center;gap:2px 10px}
.cards.people > .card .phone{font-size:13px;gap:4px}
.cards.people > .card .phone .copy{padding:1px 5px;font-size:10px}
.cards.people > .card .row .brk{display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;font-size:12px;color:var(--muted)}
.cards.people > .card .edrow{padding-top:3px;margin-top:auto;gap:12px}

/* ============ Calendar view for month-long schedules ============ */
const SCHED_RE = /^([A-Za-z]{3,9})\.?\s+(\d{1,2})\/(\d{1,2})\s*:\s*(.*)$/;
function schedLines(e){ return String(e.body||"").split("\n").filter(l=>SCHED_RE.test(l.trim())); }
function isTimeOffEntry(e){ return /time[ -]?off|days off/i.test(e.title||"") && schedLines(e).length >= 1; }
function isCalEntry(e){ return schedLines(e).length >= 14 || isTimeOffEntry(e); }
function offHTML(piece){ const p = piece.trim(); if (!p) return ""; if (/day\s+(is\s+)?locked/i.test(p)) return `<div class="shift locked">Day locked</div>`; const m = p.match(/^(.+?)\s+(off|out)\b(.*)$/i); if (m) return `<div class="shift off"><b>${esc(m[1])}</b> <span class="h">off${esc(m[3])}</span></div>`; return `<div class="shift evt">${esc(p)}</div>`; }
const TIME_RE = /((?:until|til|till|after)\s+\d{1,2}(?::\d\d)?\s*(?:am|pm)|\d{1,2}(?::\d\d)?\s*(?:am|pm)?\s*[-–]\s*\d{1,2}(?::\d\d)?\s*(?:am|pm))/i;
function shiftHTML(piece){
  const p = piece.trim(); if (!p) return "";
  const m = p.match(TIME_RE);
  if (m){
    const name = (p.slice(0,m.index) + " " + p.slice(m.index+m[0].length)).replace(/\s+/g," ").trim();
    const hrs = m[0].replace(/\s+/g," ").replace(/\s*[-–]\s*/,"–").toLowerCase();
    return name ? `<div class="shift"><b>${esc(name)}</b> <span class="h mono">${esc(hrs)}</span></div>`
                : `<div class="shift open"><b>Open shift</b> <span class="h mono">${esc(hrs)}</span></div>`;
  }
  if (/^(none|no on call|—|-)$/i.test(p)) return `<div class="shift open"><b>No one scheduled</b></div>`;
  if (p.split(/\s+/).length <= 2 && /^[A-Z]/.test(p)) return `<div class="shift"><b>${esc(p)}</b></div>`;
  return `<div class="shift evt">${esc(p)}</div>`;
}
function calHTML(e){
  const yr = +((String(e.title).match(/\b(20\d\d)\b/)||[])[1]) || new Date().getFullYear();
  const byMonth = new Map();
  schedLines(e).forEach(l=>{ const m = l.trim().match(SCHED_RE); const mo = +m[2], d = +m[3];
    if (!byMonth.has(mo)) byMonth.set(mo, new Map()); byMonth.get(mo).set(d, m[4]); });
  const now = new Date(); const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const notes = String(e.body||"").split("\n").filter(l=>!SCHED_RE.test(l.trim())).join("\n").trim();
  const toff = isTimeOffEntry(e);
  const months = [...byMonth].map(([mo, days])=>{
    const first = new Date(yr, mo-1, 1); const n = new Date(yr, mo, 0).getDate();
    let cells = DOW.map(d=>`<div class="dow">${d}</div>`).join("");
    for (let i=0;i<first.getDay();i++) cells += `<div class="calday blank" aria-hidden="true"></div>`;
    for (let d=1; d<=n; d++){
      const dt = new Date(yr, mo-1, d); const wd = dt.getDay(); const ts = dt.getTime();
      const txt = days.get(d);
      const cls = ["calday", toff && txt==null && ts!==t0 ? "noff":"", wd===0||wd===6?"wknd":"", ts===t0?"today":"", ts<t0?"past":""].filter(Boolean).join(" ");
      const inner = toff ? (txt==null ? "" : txt.split(/,\s*/).map(offHTML).join("")) : txt==null ? `<div class="shift h muted">Not scheduled yet</div>` : txt.split(/,\s*/).map(shiftHTML).join("");
      cells += `<div class="${cls}"><div class="dn"><span class="wd">${DOW[wd]}</span>${mo}/${d}</div><div class="shifts">${inner}</div></div>`;
    }
    const trail = (7 - (first.getDay()+n)%7)%7; for (let i=0;i<trail;i++) cells += `<div class="calday blank" aria-hidden="true"></div>`;
    const mname = first.toLocaleDateString(undefined,{month:"long",year:"numeric"});
    return `<div class="calmonth">${String(e.title).toLowerCase().includes(first.toLocaleDateString(undefined,{month:"long"}).toLowerCase())? "" : `<div class="calhead"><span class="lbl">${esc(mname)}</span></div>`}<div class="calscroll"><div class="calgrid" role="grid">${cells}</div></div></div>`;
  }).join("");
  return months + (notes ? `<div style="margin-top:10px">${bodyHTML(notes)}</div>` : "");
}

function sectionGroups(sec){ const g = []; list().filter(e=>e.section===sec).sort(byOrder).forEach(e=>{ const n = e.group||""; if (!g.includes(n)) g.push(n); }); const go = (cfg().groupOrder||{})[sec]; if (Array.isArray(go)) g.sort((a,b)=>{ const ra = go.indexOf(a), rb = go.indexOf(b); return (ra<0?go.length:ra)-(rb<0?go.length:rb); }); return g; }

let toastT;
function toast(msg){ let t = document.getElementById("toast"); if (!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 4000); }
function groupItems(sec, group, exceptId){ return list().filter(x=>x.section===sec && (x.group||"")===group && x.id!==exceptId).sort(byOrder); }
function orderAt(items, idx){
  const num = (x,i)=> typeof x.order==="number" ? x.order : i;
  if (!items.length) return 0;
  if (idx<=0) return num(items[0],0) - 1;
  if (idx>=items.length) return num(items[items.length-1], items.length-1) + 1;
  return (num(items[idx-1], idx-1) + num(items[idx], idx)) / 2;
}
async function moveEntry(id, group, beforeId, afterId){
  const e = S.entries.get(id); if (!e){ S.movingId=null; render(); return; }
  const sameGroup = (e.group||"")===group;
  const target = groupItems(e.section, group, id);
  let idx = target.length;
  if (beforeId){ const i = target.findIndex(x=>x.id===beforeId); if (i>=0) idx = i; }
  else if (afterId){ const i = target.findIndex(x=>x.id===afterId); if (i>=0) idx = i+1; }
  if (sameGroup && !beforeId && !afterId){ S.movingId=null; render(); return; }
  const before = entryJSON(e); const after = {...before, group};
  if (!group) delete after.group;
  after.order = Math.round(orderAt(target, idx)*1000)/1000;
  if (!sameGroup){ const mks = [...new Set(target.filter(x=>x.phone||x.email).map(x=>x.market||""))];
    if (mks.length===1){ if (mks[0]) after.market = mks[0]; else delete after.market; } }
  if (sameGroup && after.order===before.order){ render(); return; }
  const where = sameGroup ? `a new spot in ${group||"(no heading)"}` : (group||"(no heading)");
  try { await applyOps([{op:"update", id, before, after}], `Moved ${e.title} to ${where}`, ""); if (!sameGroup) S.movingId = null; toast(`Moved ${e.title} to ${where}.`); }
  catch(err){ toast(err && err.code==="invalid_argument" ? "This account can't move cards. Ask the Hub's owner for Editor access." : "Couldn't move that card. Try again."); render(); }
}
function nudge(id, dir){
  const e = S.entries.get(id); if (!e) return; const g = e.group||"";
  const vis = [...document.querySelectorAll(`section.dropzone[data-group="${CSS.escape(g)}"] .card[data-drag], #c_${CSS.escape(id)}`)].map(c=>c.id.slice(2));
  const i = vis.indexOf(id); const j = i+dir; if (i<0 || j<0 || j>=vis.length){ toast(dir<0? "Already first under this heading." : "Already last under this heading."); return; }
  return dir<0 ? moveEntry(id, g, vis[j], null) : moveEntry(id, g, null, vis[j]);
}
function clearDropMarks(){ document.querySelectorAll(".drop-before,.drop-after,.over").forEach(el=>el.classList.remove("drop-before","drop-after","over")); }
document.addEventListener("dragstart", ev=>{ const c = ev.target.closest && ev.target.closest(".card[data-drag]"); if (!c) return; ev.dataTransfer.setData("text/plain", c.dataset.drag); ev.dataTransfer.effectAllowed="move"; c.classList.add("dragging"); S.dragging = c.dataset.drag; });
document.addEventListener("dragend", ev=>{ clearDropMarks(); document.querySelectorAll(".dragging").forEach(el=>el.classList.remove("dragging")); S.dragging = null; if (S.pendingRender){ S.pendingRender=false; render(); } });
function dropTarget(ev){
  const z = ev.target.closest && ev.target.closest("section.dropzone"); if (!z) return null;
  const c = ev.target.closest(".cards.people > .card[data-drag]");
  if (c && c.dataset.drag!==S.dragging){ const r = c.getBoundingClientRect(); return {z, c, after: ev.clientX > r.left + r.width/2}; }
  return {z, c:null};
}
document.addEventListener("dragover", ev=>{ if (!S.dragging) return; const t = dropTarget(ev); if (!t) return; ev.preventDefault(); ev.dataTransfer.dropEffect="move";
  clearDropMarks(); if (t.c) t.c.classList.add(t.after? "drop-after":"drop-before"); else t.z.classList.add("over"); });
document.addEventListener("drop", ev=>{ if (!S.dragging) return; const t = dropTarget(ev); if (!t) return; ev.preventDefault(); const id = S.dragging; clearDropMarks();
  const g = t.z.dataset.group||"";

/* ============ Rename a heading ============ */
async function renameGroup(){
  const [sec, oldName] = String(S.renaming||"").split("\u0001");
  const nn = ($("#ren_in")?.value||"").replace(/\s+/g," ").trim();
  if (!nn){ S.renErr = "Type a name for this heading."; S.renDraft = ""; return render(); }
  if (nn===oldName){ S.renaming=null; S.renErr=""; S.renDraft=null; return render(); }
  const exists = list().some(e=>e.section===sec && (e.group||"")===nn);
  if (exists){ S.renErr = `There's already a heading called "${nn}". Pick a different name, or drag the cards onto that heading instead.`; S.renDraft = nn; return render(); }
  const ops = list().filter(e=>e.section===sec && (e.group||"")===oldName).map(e=>{ const before = entryJSON(e); return {op:"update", id:e.id, before, after:{...before, group:nn}}; });
  const c = cfg(); const go = c.groupOrder && Array.isArray(c.groupOrder[sec]) ? c.groupOrder[sec] : null;
  if (go){ const ng = {...c.groupOrder, [sec]: go.map(g=>g===oldName? nn : g)}; ops.push({op:"config", set:{groupOrder: ng}, before:{...c}}); }
  S.renBusy = true;
  try { await applyOps(ops, `Renamed the "${oldName}" heading to "${nn}"`, ""); S.renaming=null; S.renErr=""; S.renDraft=null; toast(`Renamed "${oldName}" to "${nn}". Undo it from the Changes tab.`); }
  catch(err){ S.renErr = err && err.code==="invalid_argument" ? "This account can't rename headings. Ask the Hub's owner for Editor access." : "Couldn't rename that heading. Try again."; S.renDraft = nn; }
  S.renBusy = false; render();
}


/* ============ Equal card heights on the Employees tab ============ */
function equalizeCards(){
  const cards = [...document.querySelectorAll(".cards.people > .card")];
  cards.forEach(c=>{ c.style.minHeight = ""; });
  if (!cards.length || window.innerWidth < 520) return;
  document.querySelectorAll(".cards.people").forEach(g=>{

/* ============ Zip code lists ============ */
const ZIP_RE = /^\s*(.+?)\s+(\d{5})(?:\s*\(([^)]+)\))?\s*$/;
function isZipEntry(e){ return /^zip/i.test(e.section||"") && String(e.body||"").split("\n").filter(l=>ZIP_RE.test(l)).length >= 3; }
const ZAREAS = [];
function areaClass(a){ let i = ZAREAS.indexOf(a); if (i<0){ ZAREAS.push(a); i = ZAREAS.length-1; } return "a"+(i%4); }
function zipListHTML(e, q){
  const lines = String(e.body||"").split("\n");
  const note = lines.filter(l=>l.trim() && !ZIP_RE.test(l)).join("\n").trim();
  const cities = new Map(); let nz = 0;
  lines.forEach(l=>{ const m = l.match(ZIP_RE); if (!m) return; nz++;
    const c = m[1].trim(); if (!cities.has(c)) cities.set(c, {zips:[], areas:new Set()});
    const o = cities.get(c); if (!o.zips.includes(m[2])) o.zips.push(m[2]); if (m[3]) o.areas.add(m[3].trim()); });
  ["Lufkin","Nacogdoches","Livingston","Huntsville"].forEach(areaClass);
  const qz = (String(q||"").match(/\b\d{5}\b/)||[])[0];

    `<div class="zrow"><a class="zcity" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c+", TX "+o.zips[0])}" target="_blank" rel="noopener" title="See ${esc(c)} on Google Maps">${hl(c,q)}<svg class="zpin" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></a>${(()=>{ const r = dd && driveLookup(dd, c); return r? `<span class="zdrive" title="Drive time from ${esc(dd.origin)}">🚗 ${esc(r.t)}</span>` : ""; })()}${[...o.areas].map(a=>`<span class="zarea ${areaClass(a)}">${esc(a)}</span>`).join("")}<span class="zzips">${o.zips.sort().map(z=>`<span class="zip${z===qz?" hit":""}">${esc(z)}</span>`).join("")}</span></div>`).join("");
  const zi = list().filter(isZipEntry).sort(byOrder).findIndex(x=>x.id===e.id);
  return `${note? `<div class="zipnote">${bodyHTML(note,q)}</div>`:""}<div class="zipmeta">${cities.size} cities · ${nz} zip codes</div><div class="ziplist zc${Math.max(0,zi)%8}">${rows}</div>${dd && dd.rows.length? `<details class="zdrives"><summary>🚗 Drive times from ${esc(dd.origin)} <span class="small muted">(${dd.rows.length} towns)</span></summary><ul>${dd.rows.map(r=>`<li><b>${esc(r.city)}</b> <span>${esc(r.t)}</span>${r.dir? ` <span class="small muted">${esc(r.dir.toLowerCase())}</span>`:""}</li>`).join("")}</ul><div class="row" style="gap:12px">${dEnt.url? `<a class="small" href="${esc(dEnt.url)}" target="_blank" rel="noopener">Open the drive-time doc ↗</a>`:""}${S.canEdit? `<button type="button" class="linkbtn" data-edit="${esc(dEnt.id)}">Edit drive times</button>`:""}</div></details>`:""}`;
}

function zipParent(z){ const t = zipNorm(z.title); return list().find(p=>p.id!==z.id && /^zip/i.test(p.section||"") && !isZipEntry(p) && !isDriveEntry(p) && p.title && t.startsWith(zipNorm(p.title))) || null; }

/* ============ Driving distances (shown on zip cards) ============ */
function isDriveEntry(e){ return /driving distance|drive time/i.test(e.group||""); }
const DRIVE_RE = /^[\s*\-•"]*([A-Za-z][A-Za-z .'\/]*?)\s*(?:[–—-]\s*|\s+)(\d[\d:.\- ]*\s*(?:hrs?|hours?|min)\w*\.?(?:\s*[\d:.\-]+\s*(?:hrs?|hours?|min)\w*\.?)?)\s*(?:\(([^)]+)\))?"?\s*$/i;
function fmtDrive(t){ return String(t).replace(/hours?|hrs?\.?/gi,"hr").replace(/minutes?|mins?\.?/gi,"min").replace(/\.(?=\s|$)/g,"").replace(/(\d)(hr|min)/g,"$1 $2").replace(/\s*-\s*/g,"–").replace(/\s+/g," ").trim(); }
function driveData(e){
  const txt = String(e.doc||"")+"\n"+String(e.body||"");
  const origin = (txt.match(/from\s+([A-Z][A-Za-z]+(?:\s[A-Z][a-z]+)?)/)||[])[1] || String(e.title||"").split("/")[0];
  const rows = []; const seen = new Set();
  txt.split("\n").forEach(l=>{ const m = l.match(DRIVE_RE); if (!m) return; const t = fmtDrive(m[2]);
    m[1].split("/").map(x=>x.trim()).filter(Boolean).forEach(c=>{ const k = zipNorm(c); if (seen.has(k)) return; seen.add(k); rows.push({city:c, key:k, t, dir:m[3]||""}); }); });
  return {origin, rows};
}
function driveFor(zipEntry){
  const t = zipNorm(zipEntry.title);
  return list().filter(isDriveEntry).find(d=>String(d.title||"").split("/").some(x=>{ const k = zipNorm(x); return k && (t.includes(k) || k.includes(t)); })) || null;
}
function driveLookup(dd, city){ const k = zipNorm(city); let r = dd.rows.find(x=>x.key===k); if (!r && k.length>=6) r = dd.rows.find(x=>x.key.length>=6 && editDist(x.key,k)<=2); return r||null; }

/* ============ Pricing & offers ============ */
function isPricingSec(sec){ return /^(pricing|offers)/i.test(sec||""); }
function priceMarkup(html){

function faqEmph(html){

/* ============ Masonry layout: balanced columns, no gaps ============ */
const FULLW = ["promolink","faqcallout","flowcard","offerscard","zipcard2","zipinfo","cal","wide","whoblock","editing"];
function masonFaq(){
  if (S.q && S.q.trim()) return;
  document.querySelectorAll("#view .cards.faq, #view .cards.pricing").forEach(grid=>{
    const cards = [...grid.querySelectorAll(":scope > .card, :scope > .faqcol > .card")];
    grid.querySelectorAll(":scope > .faqcol").forEach(c=>c.remove());
    grid.classList.remove("masoned");
    cards.forEach(c=>grid.appendChild(c));
    if (grid.querySelector(".card.editing") || cards.length < 2) return;
    const minW = grid.classList.contains("faq") ? 440 : grid.classList.contains("pricing") ? 360 : 320;
    const w = grid.clientWidth; const n = Math.max(1, Math.min(4, Math.floor((w + 12) / (minW + 12))));
    if (n < 2) return;
    const full = cards.filter(c=>FULLW.some(k=>c.classList.contains(k)));
    const rest = cards.filter(c=>!full.includes(c));
    if (rest.length < 2) return;
    const heights = rest.map(c=>c.getBoundingClientRect().height);
    grid.classList.add("masoned");
    const cols = Array.from({length:n}, ()=>{ const d = document.createElement("div"); d.className = "faqcol"; return d; });
    full.forEach(c=>grid.appendChild(c));
    cols.forEach(c=>grid.appendChild(c));
    let assign = null;
    if (!grid.classList.contains("pricing") && Math.pow(n, rest.length) <= 60000){
      let best = Infinity; const total = Math.pow(n, rest.length);
      for (let m=0; m<total; m++){
        const t = new Array(n).fill(0); let x = m; const a = [];
        for (let i=0;i<rest.length;i++){ const k = x % n; x = Math.floor(x/n); a.push(k); t[k] += heights[i] + 12; }
        const score = Math.max(...t);
        if (score < best - 0.5){ best = score; assign = a; }
      }
    }
    const tot = new Array(n).fill(0);
    rest.forEach((c,i)=>{ let k; if (assign) k = assign[i]; else { k = 0; for (let j=1;j<n;j++) if (tot[j] < tot[k] - 1) k = j; } cols[k].appendChild(c); tot[k] += heights[i] + 12; });
  });
}

/* ============ Generator flow helper ============ */
const FLOW_ARROW = /\s*(?:→|->)\s*/;
function isFlowEntry(e){ return isFaqSec(e.section) && /^\s*Q:/m.test(e.body||"") && /(→|->)/.test(e.body||""); }
function parseFlow(text){
  const blocks = []; let cur = null; const intro = [];
  String(text||"").split("\n").forEach(raw=>{
    const h = raw.match(/^\s*##\s+(.+)$/); if (h){ cur = {name:h[1].trim(), lines:[]}; blocks.push(cur); return; }
    if (cur && raw.trim()) cur.lines.push(raw); else if (!cur && raw.trim()) intro.push(raw.trim());
  });
  const out = blocks.map(b=>{
    const first = b.lines[0]||""; const qm = first.match(/^\s*Q:\s*(.+)$/);
    if (!qm) return {name:b.name, root:{out:b.lines.map(l=>l.trim()).join(" ")}};
    const root = {q:qm[1].trim(), opts:[]}; const stack = [{ind:-1, node:root}];
    b.lines.slice(1).forEach(l=>{
      const m = l.match(/^(\s*)[-•]\s+(.+)$/); if (!m) return;
      const ind = m[1].length; const parts = m[2].split(FLOW_ARROW); const label = parts.shift().trim(); const rhs = parts.join(" → ").trim();
      while (stack.length>1 && stack[stack.length-1].ind >= ind) stack.pop();
      const parent = stack[stack.length-1].node; if (!parent.opts) return;
      const qq = rhs.match(/^Q:\s*(.+)$/);
      if (qq){ const child = {q:qq[1].trim(), opts:[]}; parent.opts.push({label, child}); stack.push({ind, node:child}); }
      else parent.opts.push({label, child:{out:rhs}});
    });
    return {name:b.name, root};
  });
  out.intro = intro.join(" ");
  return out;
}
function outClass(t){ t = String(t||""); if (/not taking|do not|don't|no service|cannot/i.test(t)) return "stop"; if (/same day/i.test(t)) return "ok"; if (/thursday|next|schedule/i.test(t)) return "wait"; return "info"; }
function flowTreeHTML(node){
  if (node.out) return `<span class="to ${outClass(node.out)}">${esc(node.out)}</span>`;
  return `<span class="tq">${esc(node.q)}</span><ul>${node.opts.map(o=>`<li><span class="ta">${esc(o.label)}</span>${flowTreeHTML(o.child)}</li>`).join("")}</ul>`;
}
function flowHTML(e){

  S.flows = S.flows || {}; const st = S.flows[e.id] = S.flows[e.id] || {m:0, path:[], all:false};
  if (st.m >= flows.length) st.m = 0;
  const f = flows[st.m];
  let node = f.root; const crumbs = [];
  for (const a of st.path){ if (!node.opts || !node.opts[a]) break; crumbs.push([node.q, node.opts[a].label]); node = node.opts[a].child; }
  const tabs = `<div class="flowm" role="group" aria-label="Market">${flows.map((x,i)=>`<button type="button" data-flowm="${i}" data-fid="${esc(e.id)}" aria-pressed="${i===st.m}">${esc(x.name||"Chart "+(i+1))}</button>`).join("")}</div>`;
  const path = crumbs.length? `<div class="flowpath">${crumbs.map(([q,a])=>`<span class="st">${esc(q)} <b>${esc(a)}</b></span>`).join('<span aria-hidden="true">›</span>')}</div>`:"";
  const stage = node.out
    ? `<div class="flowout ${outClass(node.out)}" role="status"><div><span class="lbl">What to do</span>${esc(node.out)}</div></div>`
    : `<p class="flowq">${esc(node.q)}</p><div class="flowbtns">${node.opts.map((o,i)=>`<button type="button" data-flowa="${i}" data-fid="${esc(e.id)}">${esc(o.label)}</button>`).join("")}</div>`;
  const ctl = `<div class="flowctl">${st.path.length? `<button type="button" class="btn ghost sm" data-flowback="${esc(e.id)}">← Back</button><button type="button" class="btn ghost sm" data-flowreset="${esc(e.id)}">Start over</button>`:""}<button type="button" class="btn ghost sm" data-flowall="${esc(e.id)}" aria-expanded="${st.all}">${st.all? "Hide the whole chart":"Show the whole chart"}</button></div>`;
  const all = st.all? `<div class="flowtrees">${flows.map(x=>`<div><h4>${esc(x.name)}</h4><div class="flowtree">${flowTreeHTML(x.root)}</div></div>`).join("")}</div>`:"";
  return `<div class="flow">${flows.intro? `<p class="small muted" style="margin:0">${esc(flows.intro)}</p>`:""}${tabs}<div class="flowstage">${path}${stage}</div>${ctl}${all}</div>`;
}

  const a = t.closest("[data-flowa]"); if (a){ S.flows[a.dataset.fid].path.push(+a.dataset.flowa); render(); document.getElementById("c_"+a.dataset.fid)?.querySelector(".flowstage")?.scrollIntoView({block:"nearest"}); return true; }

/* ============ Quizzes ============ */
function isQuizEntry(e){ const b = String(e.body||""); return /^\s*Q:/m.test(b) && /^\s*\*\s+/m.test(b) && !/(→|->)/.test(b); }
function parseQuiz(text){
  const qs = []; let cur = null; const intro = [];
  String(text||"").split("\n").forEach(raw=>{
    const l = raw.trim(); if (!l) return;
    let m;
    if ((m = l.match(/^Q:\s*(.+)$/))){ cur = {q:m[1], opts:[], ans:-1, answers:[], why:""}; qs.push(cur); }
    else if (cur && (m = l.match(/^\*\s+(.+)$/))){ if (cur.ans<0) cur.ans = cur.opts.length; cur.answers.push(cur.opts.length); cur.opts.push(m[1]); }
    else if (cur && (m = l.match(/^[-•]\s+(.+)$/))){ cur.opts.push(m[1]); }
    else if (cur && (m = l.match(/^>\s*(.+)$/))){ cur.why += (cur.why? " ":"") + m[1]; }
    else if (!cur && !/^##\s/.test(l)) intro.push(l);
  });
  const out = qs.filter(x=>x.opts.length>=2 && x.ans>=0); out.forEach(x=>{ x.multi = x.answers.length>1; }); out.intro = intro.join(" "); return out;
}
function qOk(q, p){ return q.multi ? (Array.isArray(p) && p.length===q.answers.length && q.answers.every(a=>p.includes(a))) : p===q.ans; }
function qTxt(q, p){ return Array.isArray(p)? p.map(k=>q.opts[k]).join(" + ") : (q.opts[p]||""); }
function qRightTxt(q){ return q.answers.map(k=>q.opts[k]).join(" + "); }

    ${q.multi && !done? `<div class="flowctl"><button type="button" class="btn" data-qcheck="${esc(e.id)}" ${(st.sel||[]).length? "":"disabled"}>Check answer</button></div>`:""}
    ${done? `<div class="qfb ${qOk(q,picked)?"ok":"no"}" role="status"><b>${qOk(q,picked)? "Correct!" : q.multi? "Not quite. The answers are "+q.answers.map(k=>L[k]).join(" and ")+"." : "Not quite. The answer is "+L[q.ans]+"."}</b>${q.why? `<span>${esc(q.why)}</span>`:""}</div><div class="flowctl"><button type="button" class="btn" data-qnext="${esc(e.id)}">${st.i+1<qs.length? "Next question →" : "See my score"}</button></div>`:""}
  </div>`;
}

/* ============ CSR training path ============ */
const PASS = 0.8;
function isTrainingEntry(e){ return isQuizSec(e.section) && /training path/i.test(e.group||"") && /^level\s+\d+/i.test(e.title||""); }
function levelNum(e){ const m = String(e.title||"").match(/^level\s+(\d+)/i); return m? +m[1] : 0; }
function trainingTracks(){ const t = [...new Set(list().filter(isTrainingEntry).map(e=>e.group))]; return t.sort((a,b)=>(/csr/i.test(b)?1:0)-(/csr/i.test(a)?1:0) || a.localeCompare(b)); }
function trackPfx(track){ return /^csr/i.test(track||"") ? "" : String(track||"").replace(/training path/i,"").trim().slice(0,1).toUpperCase()+"~"; }
function trackWho(track){ return /^csr/i.test(track||"") ? "CSR" : String(track||"").replace(/\s*training path\s*/i,"").trim() || "Trainee"; }
function trackNames(track){
  if (/^csr/i.test(track||"")) return employeeNames();
  const w = trackWho(track).replace(/s$/i,""); const re = new RegExp("\\b"+w.replace(/[^a-z]/gi,"").slice(0,8), "i");
  const set = new Set(); list().filter(e=>isEmployeesSec(e.section) && (e.phone||e.email) && re.test(e.role||"")).forEach(e=>{ const n = cleanName(e.title); if (n) set.add(n); });
  set.add("Trainer"); return [...set].sort((a,b)=>a.localeCompare(b));
}
function tpState(track){ S.tps ||= {}; let st = S.tps[track]; if (!st){ st = S.tps[track] = {open:null}; const key = /^csr/i.test(track)? "hub_quiz_name" : "hub_quiz_name_"+trackPfx(track);
  try { const l = localStorage.getItem(key); st.trainee = (l && trackNames(track).includes(l))? l : ""; } catch(e){ st.trainee = ""; } } return st; }
function trainingLevels(track){
  const lv = new Map();
  list().filter(e=>isTrainingEntry(e) && (!track || e.group===track)).forEach(e=>{ const n = levelNum(e); if (!lv.has(n)) lv.set(n, {n}); const o = lv.get(n); if (isQuizEntry(e)) o.test = e; else o.lesson = e; });
  return [...lv.values()].filter(o=>o.lesson||o.test).sort((a,b)=>a.n-b.n).map(o=>({...o, name: String((o.lesson||o.test).title).replace(/^level\s+\d+\s*(test)?\s*[:—–-]\s*/i,"")}));
}
function allAttempts(){ if (S.canEdit) return quizResultsFlat(); const d = S.myQuizDoc; return (d && Array.isArray(d.attempts))? d.attempts : []; }
function bestPct(name, testId){ let b = -1; allAttempts().forEach(a=>{ if (a.quizId===testId && a.name===name && a.total){ b = Math.max(b, a.score/a.total); } }); return b; }
function nameKey(n){ return String(n||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "x"; }
function signoffItems(lesson){
  const out = []; let on = false;
  String((lesson&&lesson.body)||"").split("\n").forEach(l=>{ const h = l.match(/^\s*##\s+(.+)$/); if (h){ on = /sign.?off/i.test(h[1]); return; } const b = l.match(/^\s*[-•]\s+(?:\[\s?\]\s*)?(.+)$/); if (on && b) out.push(b[1].trim()); });
  return out;
}
function lessonBodyNoSignoff(lesson){ const out = []; let on = false; String(lesson.body||"").split("\n").forEach(l=>{ const h = l.match(/^\s*##\s+(.+)$/); if (h) on = /sign.?off/i.test(h[1]); if (!on) out.push(l); }); return out.join("\n"); }
function marksFor(name){ const d = (S.signoffs||{})[nameKey(name)]; return (d && d.marks) || {}; }
function markKey(L, k){ return trackPfx(L.track) + L.n + "-" + k; }
function levelStatus(name, L, i, levels){
  if (!name) return {k:"locked", label:"Pick your name"};
  const prevOk = i===0 || /^trainer$/i.test(name) || (levels[i-1].test ? bestPct(name, levels[i-1].test.id) >= PASS : true);
  const b = L.test ? bestPct(name, L.test.id) : -1;
  const items = signoffItems(L.lesson); const m = marksFor(name); const done = items.filter((_,k)=>m[markKey(L,k)]).length;
  if (b >= PASS && done >= items.length) return {k:"done", label:"Complete ✓", b, done, items:items.length};
  if (b >= PASS) return {k:"passed", label:`Passed ${Math.round(b*100)}% · sign-off ${done}/${items.length}`, b, done, items:items.length};
  if (!prevOk) return {k:"locked", label:`Locked · pass Level ${levels[i-1].n} first`};
  if (b >= 0) return {k:"fail", label:`Best ${Math.round(b*100)}% · need 80%`, b, done, items:items.length};

}
function trainingHTML(track){

    <div class="qname"><label for="${sid}">Who's training?</label><select id="${sid}" data-tpname="${esc(track)}"><option value="">Choose your name…</option>${names.map(n=>`<option ${n===me?"selected":""}>${esc(n)}</option>`).join("")}</select></div></div>
    <div class="tlevels">${cards}</div>${me? "" : `<p class="small muted" style="margin:0">Choose your name to see your progress.</p>`}${open}</section>`;

  if (!S.canEdit) return ""; if (track === undefined) return trainingTracks().map(t=>trainingProgressHTML(t)).join("");

/* ============ Breaks & lunches board ============ */
function isBreaksGroup(name, items){ return /break/i.test(name||"") && /lunch/i.test(name||"") && items.some(e=>/lunch/i.test(e.title||"")) && items.some(e=>/break/i.test(e.title||"") && String(e.body||"").includes(" | ")); }
function tblRows(e){ return String(e.body||"").split("\n").filter(l=>l.includes(" | ")).map(l=>l.split(" | ").map(x=>x.trim())); }
function parseRange(t){
  const m = String(t||"").replace(/\s+/g,"").match(/^(\d{1,2})(?::(\d\d))?(am|pm)?[–—-](\d{1,2})(?::(\d\d))?(am|pm)?$/i); if (!m) return null;
  const toMin = (h,mi,ap)=>{ h=+h; mi=+(mi||0); ap=(ap||"").toLowerCase(); if (ap==="pm" && h<12) h+=12; if (ap==="am" && h===12) h=0; return h*60+mi; };
  let ea = m[6]||m[3]||""; let sa = m[3];
  if (!sa){ sa = ea; const sh=+m[1], eh=+m[4]; if (ea.toLowerCase()==="pm" && (sh>eh && sh!==12 || sh===11)) sa="am"; if (ea.toLowerCase()==="pm" && sh===12) sa="pm"; }
  let a = toMin(m[1],m[2],sa), b = toMin(m[4],m[5],ea); if (!ea && b<a) b+=720; if (!sa && a<7*60) { a+=720; b+=720; }
  return b>a ? {a,b} : null;
}
function fmtMin(x, ap){ const h = Math.floor(x/60), mi = x%60; const h12 = ((h+11)%12)+1; return `${h12}${mi? ":"+String(mi).padStart(2,"0"):""}${ap? (h<12?"am":"pm"):""}`; }
function fmtRange(r){ return `${fmtMin(r.a, (r.a<720)!==(r.b<720))}–${fmtMin(r.b,true)}`; }
function breaksPeople(items){
  const ppl = new Map(); const get = n=>{ const k = n.trim(); if (!ppl.has(k)) ppl.set(k, {name:k, slots:[]}); return ppl.get(k); };
  const names = c=>String(c||"").split(/,|&|\band\b/).map(x=>x.trim()).filter(Boolean);
  const lunches = items.filter(e=>/lunch/i.test(e.title||"") && String(e.body||"").includes(" | ")).sort(byOrder); const lunch = lunches[0];
  const brk = items.find(e=>/break/i.test(e.title||"") && !/lunch/i.test(e.title||"") && String(e.body||"").includes(" | "));
  lunches.forEach((le,ti)=>tblRows(le).forEach(r=>{ const rg = parseRange(r[0]); if (rg) names(r[1]).forEach(n=>{ const p = get(n); if (p.team==null) p.team = ti; p.slots.push({kind:"lunch", ...rg}); }); }));
  if (brk){ const rows = tblRows(brk); const hdr = rows[0]||[]; rows.slice(1).forEach(r=>{ for (let c=1;c<r.length;c++){ const rg = parseRange(r[c]); if (rg) names(r[0]).forEach(n=>get(n).slots.push({kind:"break", label:hdr[c]||"Break", ...rg})); } }); }
  const list = [...ppl.values()].filter(p=>p.slots.length);
  list.forEach(p=>p.slots.sort((x,y)=>x.a-y.a));
  const lst = p=>(p.slots.find(x=>x.kind==="lunch")||{a:9999}).a;
  list.forEach(p=>{ if (p.team==null) p.team = 0; });
  return {list: list.sort((x,y)=>x.team-y.team || lst(x)-lst(y) || x.name.localeCompare(y.name)), lunch, lunches, brk};
}
const ICON_OK = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>`;
const ICON_LOCK = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
function breaksBoardHTML(items){

  }).join("");
  const timeline = `<div class="brkpanel"><div class="row between" style="flex-wrap:wrap;gap:8px"><h3 style="margin:0">Today's breaks & lunches</h3><div class="brkleg"><span><i class="l"></i>Lunch (1 hr)</span><span><i class="b"></i>Break (15 min)</span></div></div>${nowBar}<div class="tl"><div class="hd"></div><div class="hrs">${hrs.join("")}</div>${rows}</div></div>`;
  let rulesH = "";
  if (rules){ const lines = String(rules.body||"").split("\n").map(l=>l.replace(/^\s*[-•]\s*/,"").trim()).filter(Boolean);
    rulesH = `<div class="brkpanel"><h3 style="margin:0">${esc(rules.title||"Rules")}</h3><ul class="brkrules">${lines.map(l=>{ const w = /lock|2 weeks|advance/i.test(l); return `<li class="${w?"warn":""}">${w? ICON_LOCK: ICON_OK}<span>${esc(l)}</span></li>`; }).join("")}</ul></div>`; }
  const ed = S.canEdit? `<div class="brkedit">${[...lunches, brk, rules].filter(Boolean).map(e=>`<button type="button" class="linkbtn" data-edit="${esc(e.id)}">Edit ${esc(lunches.length>1? String(e.title).toLowerCase() : String(e.title).toLowerCase().replace(/^csr\s+/,""))}</button>`).join("")}</div>` : "";
  return `<div class="brk">${timeline}${rulesH}${ed}</div>`;
}

function parseGlossary(e){

    parts.slice(2).forEach(p=>{ const k = p.match(/^\s*(says|part|tip)\s*:\s*(.*)$/i); if (!k) return; const key = k[1].toLowerCase();

    out.push(t); });

}

  const qt = glTok(q); if (!qt.length) return 0; const qs = new Set(qt); const ql = " "+String(q).toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ")+" ";
  const sum = a=>a.reduce((x,w)=>x+glW(w),0);
  let best = 0;
  t.says.forEach(p=>{ const pt = glTok(p); if (!pt.length) return; const hw = sum(pt.filter(w=>qs.has(w))); let s = hw*hw/Math.max(sum(pt),.01); if (pt.every(w=>qs.has(w))) s += pt.length>1? 1.2*pt.length : 0.6; if (s>best) best = s; });

  const dh = sum([...new Set(glTok(t.def))].filter(w=>qs.has(w)));
  return best*1.6 + nh*1.6 + dh*0.25;
}

function glApply(){

  root.querySelectorAll(".glsvg .gp").forEach(g=>g.classList.toggle("sel", g.dataset.gpart===part));
  root.querySelectorAll("[data-gllayer]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.gllayer===lay)));
  const pn = root.querySelector(".glpanel"); if (pn) pn.outerHTML = glPanelHTML(part, S.glTerms||[]);
  root.querySelectorAll(".glcat").forEach(c=>c.classList.toggle("hide", lay!=="all" && !c.classList.contains(lay)));

  } }
}

function glShrink(im, max, budget){ let w = im.naturalWidth, h = im.naturalHeight; const r = Math.min(1, max/Math.max(w,h)); w = Math.round(w*r); h = Math.round(h*r);

function capDays(){ const t = new Date(); t.setHours(0,0,0,0); const lab = ["Today","Tomorrow","Two Days Out","Three Days Out"];
  return lab.map((l,i)=>{ const d = new Date(t.getFullYear(), t.getMonth(), t.getDate()+i); const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; return {l, d, k, s:`${d.getMonth()+1}/${d.getDate()} · ${d.toLocaleDateString(undefined,{weekday:"short"})}`}; }); }
function capCanEdit(){ return S.canEdit || isOcEditor(); }
function capDoc(id){ const base = (S.cap||{})[id] || {}; let best = null;
  (S.ocEdits||[]).forEach(d=>{ if (!ocListed(d.id, d.name)) return; const o = d.cap && d.cap[id]; if (o && o.at && (!best || o.at > best.at)) best = {...o, by:d.id}; });
  if (best && best.at > String(base.updatedAt||"")){ const v = {...base, updatedAt:best.at, updatedBy:best.by}; if (best.cells) v.cells = best.cells; if (best.more!==undefined) v.more = best.more; return v; }
  return base; }
function capCell(mid, row, k){ return ((capDoc(mid).cells||{})[row+"|"+k]) || null; }
async function capSave(mid, patch){
  const cur = capDoc(mid); const next = {...cur, ...patch, updatedAt:new Date().toISOString(), updatedBy:S.myId||null};
  if (!S.canEdit){ if (!isOcEditor() || !S.myId) return false;
    const mine = (S.ocEdits||[]).find(d=>d.id===S.myId) || {}; const cap = {...(mine.cap||{}), [mid]: {cells:next.cells||{}, more:next.more||"", at:next.updatedAt}};
    const doc = {uid:S.myId, name:S.meName||"", rows:mine.rows||{}, lastAt:mine.lastAt||"", cap};
    S.ocEdits = [...(S.ocEdits||[]).filter(d=>d.id!==S.myId), {id:S.myId, ...doc}]; render();
    try { await S.db.doc("oncallEdits/"+S.myId).set(doc); return true; } catch(e){ toast(S.canWrite===false? "Your Hub access can't save yet. Ask a manager to set you to Editor in Share." : "Couldn't save that. Try again."); return false; } }
  S.cap = {...(S.cap||{}), [mid]: next}; render();
  try { await S.db.doc("capacity/"+mid).set(next); return true; } catch(e){ toast("Couldn't save that. Try again."); return false; }
}
function capAgo(iso){ if (!iso) return ""; const d = new Date(iso); const t0 = new Date(); t0.setHours(0,0,0,0); const days = Math.floor((t0 - new Date(d.getFullYear(), d.getMonth(), d.getDate()))/864e5);
  const when = days<=0? "today" : days===1? "yesterday" : d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); return `${when} at ${d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}`; }
function capLast(){ let best = null; CAP_MKTS.forEach(m=>{ const d = capDoc(m.id); if (d.updatedAt && (!best || d.updatedAt > best.updatedAt)) best = {...d, mid:m.id}; }); return best; }

function capSummary(){

  CAP_MKTS.forEach(m=>{ const parts = []; m.rows.forEach(r=>{ const ds = days.map(d=>{ const c = capCell(m.id,r,d.k); const st = c && CAP_ST[c.s]? c.s : "open"; return `${d.l} ${d.s}: ${CAP_ST[st][0]}${c && c.n? " ("+c.n+")":""}`; }); parts.push(`  ${r}: ${ds.join("; ")}`); });

document.addEventListener("click", async ev=>{ const t = ev.target.closest && ev.target.closest("[data-capcell],[data-capst],[data-capsave],[data-capclose],[data-capmore],[data-caprules],[data-captextsave],[data-capnumedit],[data-capnumcancel],[data-capnumsave]"); if (!t) return;

/* ============ Paylocity ============ */
function isPaylocitySec(sec){ return /^paylocity/i.test(sec||""); }
function isQAEntry(e){ return /^\s*Q:/m.test(e.body||"") && !/^\s*\*\s+/m.test(e.body||""); }
function parseQA(body){
  const groups = []; let g = {name:"", qs:[]}; groups.push(g); let cur = null;
  String(body||"").split("\n").forEach(raw=>{ const l = raw.trim(); if (!l) return;
    let m;
    if ((m = l.match(/^##\s+(.+)$/))){ g = {name:m[1], qs:[]}; groups.push(g); cur = null; return; }
    if ((m = l.match(/^Q:\s*(.+)$/))){ cur = {q:m[1], a:[]}; g.qs.push(cur); return; }
    if (cur) cur.a.push(l.replace(/^A:\s*/,""));
  });
  return groups.filter(x=>x.qs.length);
}

  S.hbOpen ||= new Set();
  const qa = faqs.map(e=>parseQA(e.body).map((g,gi)=>`<section class="hbch hc${gi%5}"><div class="hbchh"><div><h3>${esc(g.name||e.title)}</h3></div></div>${g.qs.map((x,qi)=>{ const id = e.id+"-"+gi+"-"+qi; const open = S.hbOpen.has(id);

  return `${addBtn? `<div class="row" style="justify-content:flex-end">${addBtn}</div>`:""}${newForm}
