/* ============ Service-area lookup (city or zip) ============ */
const ZIP_INTENT = /\b(servic\w*|cover\w*|zip\w*|zone\w*|area|go (out )?to|travel to)\b/i;
const ZIP_NOTPLACE = /\b(water|heater|heaters|ac|a\/c|hvac|plumb\w*|generator\w*|furnace|duct\w*|commercial|residential|tankless|mini|split|boiler|pool|sewer|drain|septic|electric\w*|brand|unit|units|equipment|warranty|calls?|fee|charge|price|membership)\b/i;
const ZIP_NOTAREA = /\b(invoices?|bills?|billing|who|whom|get with|talk to|contact|managers?|srms?|update|change|fix|correct|payments?|refunds?|prices?|pricing|costs?|fees?|nap|sleep)\b/i;
const ZIP_STOP = new Set(["do","we","you","our","service","services","serve","cover","is","are","the","a","an","in","to","of","area","zip","zone","code","can","does","go","out","there","that","this","for","still","city","town","customer","customers","job","jobs","book","what","which","if","they","it","on","at","near","tx","texas","and","or","anyone","someone","someplace","place","call","calls","run","travel","get"]);
function zipNorm(x){ return norm(x).replace(/\bmt\b/g,"mount").replace(/\bft\b/g,"fort").replace(/\bst\b/g,"saint").replace(/-/g," ").replace(/\s+/g," ").trim(); }
function zipIndex(){
  const rows = [];
  list().filter(isZipEntry).forEach(e=>{
    const notes = String(e.body||"").split("\n").map(l=>l.trim()).filter(l=>l && !ZIP_RE.test(l));
    String(e.body||"").split("\n").forEach(l=>{ const m = l.match(ZIP_RE); if (!m) return;
      const names = m[1].split(/,|\//).map(x=>x.trim()).filter(Boolean);
      names.forEach(n=>rows.push({city:n, key:zipNorm(n), zip:m[2], extra:m[3]||"", e, notes}));
    });
  });
  return rows;
}
function editDist(a,b){ if (Math.abs(a.length-b.length)>2) return 9; const d = Array.from({length:a.length+1},(_,i)=>[i]); for (let j=1;j<=b.length;j++) d[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function zipLookup(q){
  const idx = zipIndex(); if (!idx.length) return null;
  const zips = [...new Set(String(q).match(/\b\d{5}\b/g)||[])];
  if (!zips.length && ZIP_NOTAREA.test(q)) return null;
  const nq = zipNorm(q); const words = nq.split(" ").filter(Boolean);
  const content = words.filter(w=>!ZIP_STOP.has(w) && !/^\d+$/.test(w));
  const intent = zips.length || ZIP_INTENT.test(q) || (content.length && content.length<=3 && words.length<=5);
  if (!intent) return null;
  const hits = [];
  zips.forEach(z=>{ const r = idx.filter(x=>x.zip===z); hits.push({label:z, rows:r, zip:true}); });
  // city names: exact whole-phrase match first (longest wins), then close spelling
  const cityKeys = [...new Set(idx.map(x=>x.key))].sort((a,b)=>b.length-a.length);
  let rest = " "+nq+" "; const found = [];
  cityKeys.forEach(k=>{ if (rest.includes(" "+k+" ")){ found.push(k); rest = rest.replace(" "+k+" ","  "); } });
  if (!found.length && content.length && !ZIP_NOTPLACE.test(q)){
    const grams = []; for (let n=3;n>=1;n--) for (let i=0;i+n<=content.length;i++) grams.push(content.slice(i,i+n).join(" "));
    for (const g of grams){ if (g.length<5) continue; const tol = g.length>=8? 2 : 1;
      let best=null, bd=9; cityKeys.forEach(k=>{ const d = editDist(g,k); if (d<bd){ bd=d; best=k; } });
      if (best && bd<=tol){ found.push(best); break; } }
  }
  if (!found.length && !zips.length){ const zt = list().filter(isZipEntry).find(e=>(" "+nq+" ").includes(" "+zipNorm(e.title)+" "));
    if (zt){ const n = String(zt.body||"").split("\n").filter(l=>ZIP_RE.test(l)).length; return [{label: zt.title, rows:[], zone:zt, n}]; } }
  found.forEach(k=>hits.push({label: idx.find(x=>x.key===k).city, rows: idx.filter(x=>x.key===k)}));
  if (!hits.length){
    const m = String(q).match(/\b(?:service|cover|go(?: out)? to|travel to)\s+(?:the\s+)?(?:city of\s+|town of\s+)?([a-z][a-z .'-]{2,30}?)(?:,?\s*(?:tx|texas))?\s*\??\s*$/i);
    if (!m || ZIP_NOTPLACE.test(m[1]) || m[1].trim().split(/\s+/).length>3) return null;
    hits.push({label: m[1].trim().replace(/\b\w/g,c=>c.toUpperCase()), rows:[], guess:true});
  }
  return hits;
}
function zipAnswer(q){
  const hits = zipLookup(q); if (!hits) return false;
  const how = list().find(e=>/^zip/i.test(e.section||"") && /how to check/i.test(e.title||""));
  const ids = new Set(); const out = [];
  hits.forEach(h=>{
    if (h.zone){ out.push(`Yes, ${h.label} is one of our service zones (${h.n} zip codes). Open Zip Codes to see the full list, or ask Marli about a specific city or zip.`); ids.add(h.zone.id); return; }
    if (!h.rows.length){ out.push(`${h.label} isn't on the Hub's zip code list.`); if (how) ids.add(how.id); return; }
    const zones = new Map(); h.rows.forEach(r=>{ const k = r.e.id; if (!zones.has(k)) zones.set(k, {e:r.e, zips:new Set(), cities:new Set(), extra:new Set(), notes:r.notes}); const z = zones.get(k); z.zips.add(r.zip); z.cities.add(r.city); if (r.extra) z.extra.add(r.extra); ids.add(k); });
    const REF = /jd precision/i;
    const refer = [...zones.values()].filter(z=>REF.test(z.e.title));
    const regular = [...zones.values()].filter(z=>!REF.test(z.e.title) && !/commercial|industrial|eagle/i.test(z.e.title));
    const special = [...zones.values()].filter(z=>!REF.test(z.e.title) && /commercial|industrial|eagle/i.test(z.e.title));
    if (refer.length && !regular.length && !special.length){ out.push(`${h.label} is JD Precision Plumbing's area. Send the customer to our sister company, JD Precision Plumbing${refer[0].e.phone? " at "+refer[0].e.phone : ""}.`); refer.forEach(z=>z.notes.filter(n=>!/^we don.?t service/i.test(n)).slice(0,2).forEach(n=>out.push(`  ${n}`))); return; }
    out.push(regular.length? `${["Good news!","Yes, we can help there.","Great, that's in our area."][Math.floor(Math.random()*3)]} Yes, we service ${h.label}.` : `Only on a special list: ${h.label} isn't in a regular service zone.`);
    [...regular, ...special].forEach(z=>{
      const cities = h.zip? ` (${[...z.cities].join(", ")})` : "";
      const spec = /commercial|industrial|eagle/i.test(z.e.title);
      out.push(`- ${spec? (regular.length? "Also on ":"")+z.e.title+" list" : z.e.title+" zone"}${cities}: ${[...z.zips].join(", ")}${z.extra.size? " · "+[...z.extra].join(", "):""}`);
      z.notes.filter(n=>!/^for sugar land/i.test(n)).slice(0,2).forEach(n=>out.push(`  ${n}`));
      if (!spec){ const de = driveFor(z.e); if (de){ const dd = driveData(de); const r = [...z.cities].map(c=>driveLookup(dd,c)).find(Boolean); if (r) out.push(`  Drive time: about ${r.t} from ${dd.origin}`); } }
    });
  });
  if (how) out.push(`Not sure? Check ServiceTitan: settings wheel > search "zone" > Operations > Zones.`);
  S.answer = {q, text: out.join("\n"), ids:[...ids].slice(0,4), status:"done", quick:true}; logAsk(S.answer);
  render(); return true;
}

const DOC_FIELDS = ["doc","docAt","docNote"];
function keepDoc(id, body){ const prev = S.entries.get(id); if (prev) DOC_FIELDS.forEach(k=>{ if (prev[k]!==undefined && body[k]===undefined) body[k] = prev[k]; }); return body; }
function cleanEntry(o){ const e = {}; if (o.doc!==undefined && o.doc!==null) e.doc = String(o.doc); FIELDS.forEach(f=>{ if (o[f]!==undefined && o[f]!==null) e[f] = f==="pinned" ? !!o[f] : f==="order" ? Number(o[f])||0 : String(o[f]); }); return e; }
function buildProposal(res, request){
  const ops = [];
  for (const o of (res && Array.isArray(res.ops) ? res.ops : [])){
    if (o.op==="update" && S.entries.has(o.id) && o.set){ const before = entryJSON(S.entries.get(o.id)); const after = {...before, ...cleanEntry(o.set)}; if (diffRows(before,after)) ops.push({op:"update", id:o.id, before, after}); }
    else if (o.op==="delete" && S.entries.has(o.id)){ ops.push({op:"delete", id:o.id, before:entryJSON(S.entries.get(o.id))}); }
    else if (o.op==="add" && o.entry && o.entry.title && o.entry.section){ ops.push({op:"add", id:newId(o.entry), before:null, after:cleanEntry(o.entry)}); }
    else if (o.op==="config" && o.set){ const allowed = {}; ["name","tagline","markets","sections","askContact","tabGroups","notifyEmails"].forEach(k=>{ if (o.set[k]!==undefined) allowed[k]=o.set[k]; }); if (Object.keys(allowed).length) ops.push({op:"config", set:allowed, before:{...cfg()}}); }
  }

}
function newId(e){ const base = String(e.section||"x").split(/\s/)[0].toLowerCase().replace(/[^a-z0-9]/g,"") + "-" + String(e.title).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
  let id = base || "entry", i = 2; while (S.entries.has(id)) id = base+"-"+(i++); return id; }
async function applyOps(ops, summary, request){
  const now = new Date().toISOString(); const done = [];
  for (const o of ops){
    if (o.op==="update" || o.op==="add"){ const body = keepDoc(o.id, {...o.after, updatedAt:now, updatedBy:S.myId||null}); delete body.id; if (o.after && o.after.doc!==undefined && (!S.entries.get(o.id) || S.entries.get(o.id).doc!==o.after.doc)) body.docAt = now; await S.db.doc("entries/"+o.id).set(body); }
    else if (o.op==="delete"){ await S.db.doc("entries/"+o.id).delete(); }
    else if (o.op==="config"){ await S.db.doc("config/hub").set({...cfg(), ...o.set, updatedAt:now}); }
    done.push(o);
  }
  try { await S.db.collection("changes").add({summary: summary || ops.map(opLabel).join(", "), request: request||"", ops: done, at: now, by: S.myId||null}); } catch(e){}
}
async function applyProposal(){

  catch(err){ S.updStatus = err && err.code==="invalid_argument" ? "This account can't save changes. Ask the Hub's owner for Editor access." : err && err.code==="quota_exceeded" ? "The Hub is full. Remove some old entries first." : "Some changes didn't save. Check the Changes tab, then try again."; }

}
async function undoChange(id){
  const x = S.changes.find(c=>c.id===id); if (!x) return;
  const now = new Date().toISOString();
  try {
    for (const o of [...(x.ops||[])].reverse()){
      if (o.op==="add") await S.db.doc("entries/"+o.id).delete();
      else if (o.op==="update" || o.op==="delete"){ const b = keepDoc(o.id, {...o.before, updatedAt:now, updatedBy:S.myId||null}); delete b.id; await S.db.doc("entries/"+o.id).set(b); }
      else if (o.op==="config" && o.before){ await S.db.doc("config/hub").set({...o.before, updatedAt:now}); }
    }
    await S.db.doc("changes/"+id).update({undone:true, undoneAt:now});
  } catch(err){ S.updStatus = "Couldn't undo that change. Try again."; render(); }
}

/* Schedule look-ahead for Marli: every dated line ("Sat 10/3: Name") for the next days */
const DOWL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function schedAhead(days){
  const t0 = new Date(); t0.setHours(0,0,0,0); const want = new Map();
  for (let i=0;i<days;i++){ const d = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate()+i); want.set((d.getMonth()+1)+"/"+d.getDate(), d); }
  const out = [];
  list().forEach(e=>{ if (!inMarket(e)) return; String(e.body||"").split("\n").forEach(l=>{ const m = l.trim().match(SCHED_RE); if (!m) return; const k = (+m[2])+"/"+(+m[3]); if (want.has(k)) out.push({d:want.get(k), k, e, text:m[4].trim()}); }); });
  return out.sort((a,b)=>a.d-b.d || byOrder(a.e,b.e));
}
function scheduleBlock(days){
  const rows = schedAhead(days); if (!rows.length) return "(no dated schedule lines for the next "+days+" days)";
  const byDay = new Map(); rows.forEach(r=>{ const key = DOWL[r.d.getDay()]+" "+r.k; if (!byDay.has(key)) byDay.set(key, []); byDay.get(key).push(r); });
  return [...byDay].map(([day, rs])=>day+":\n"+rs.map(r=>`- ${r.e.title} [${r.e.section}${r.e.market? ", "+r.e.market:""}] (id ${r.e.id}): ${r.text}`).join("\n")).join("\n");
}
function weekendText(){
  const t = new Date(); t.setHours(0,0,0,0); const wd = t.getDay();
  const sat = new Date(t.getFullYear(), t.getMonth(), t.getDate() + (wd===0 ? -1 : (6-wd)));
  const sun = new Date(sat.getFullYear(), sat.getMonth(), sat.getDate()+1);
  const f = d=>`${DOWL[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`;
  return `"This weekend" means ${f(sat)} and ${f(sun)}${wd===5? " (Friday night counts too if they ask about tonight)":""}.`;
}

    a.text = res.text; a.status = "done"; rememberSass(a.text); setTimeout(()=>logAsk(a), 0);
  } catch(err){
    if (err && err.code==="cancelled") return;
    if (err && (err.code==="not_granted" || err.code==="capability_disabled" || err.code==="unavailable")){ quickAnswer(q, "Marli needs your OK to write full answers. Refresh the page and choose Allow when it asks. Here’s what the Hub has in the meantime:"); return; }
    a.status = "error"; a.err = err && err.code==="not_granted" ? "Answers need your OK to use Claude. Keyword results below still work." : err && err.code==="rate_limited" ? "Too many questions at once. Wait a moment and try again." : "Couldn't get an answer right now. Keyword results below still work.";
  }
  const m = a.text.match(/SOURCES:\s*(.*)\s*$/i); if (m) a.ids = m[1].split(/[,\s]+/).filter(x=>S.entries.has(x));
  if (S.answer===a) paintAnswer();
}

/* Marli fallback: answers from Hub entries without Claude (keyword match) */
function quickLines(q){
  const toks = tokens(q); const res = search(q, 6);
  const picks = []; res.forEach(e=>{ const ls = (String(e.body||"")+"\n"+String(e.doc||"")).split("\n").map(l=>l.replace(/^\s*[-•#]+\s*/,"").trim()).filter(Boolean);
    const sc = l=>toks.filter(t=>norm(l).includes(t)).length; const hit = ls.filter(l=>!/:\s*$/.test(l) && sc(l)>0).sort((a,b)=>sc(b)-sc(a)).slice(0,2);
    const phone = e.phone? ` (${e.phone})`:""; picks.push({e, text: hit.length? hit.join(" · ") : (ls[0]||e.role||"")+"", phone}); });
  return picks.filter(p=>p.text).slice(0,4);
}
const NAP_Q = /\b(nap|naps|napping|sleep|sleeping|snooze|snoozing|doze|dozing|rest my eyes|shut ?eye)\b/i;
const NAP_LINES = [
  "Sorry, no naps on the clock. Customers are calling, so grab a coffee or a quick stretch and save the rest for your lunch break.",
  "That's a no on napping during your shift. A quick stretch or some water can help, and your lunch break is the time to recharge.",
  "We need to stay awake and available while we're on the clock. Try a coffee or a short stretch, and rest up on your lunch break."
];
function quickAnswer(q, note){
  if (NAP_Q.test(q) && !/\b(sick|dizzy|unsafe|not feeling well|ill)\b/i.test(q)){ S.answer = {q, text: NAP_LINES[Math.floor(Math.random()*NAP_LINES.length)], ids:[], status:"done", quick:true, note: note||""}; logAsk(S.answer); render(); return; }
  if (zipAnswer(q)) return;
  let picks = quickLines(q);
  if (SCHED_Q.test(q)){ let rows = schedAhead(10); const tw = new Date(); tw.setHours(0,0,0,0);
    if (/weekend/i.test(q)){ const wd = tw.getDay(); rows = rows.filter(r=>r.d.getDay()===6||r.d.getDay()===0).filter(r=>(r.d-tw)/864e5 <= (wd===0?0:7-wd)); }
    else if (/tomorrow/i.test(q)){ rows = rows.filter(r=>Math.round((r.d-tw)/864e5)===1); }
    else if (!/week/i.test(q)){ rows = rows.filter(r=>+r.d===+tw); }
    if (rows.length) picks = rows.map(r=>({e:r.e, phone:"", text:`${DOWL[r.d.getDay()].slice(0,3)} ${r.k}: ${r.text}`})); }
  const pick = a=>a[Math.floor(Math.random()*a.length)];
  const HITS = ["Here's what I found:","Here's what the Hub has:","Found it on the Hub:","This should help:"];
  const MISS = ["I couldn't find that on the Hub.","That one isn't on the Hub yet.","The Hub doesn't have anything on that yet."];
  const text = picks.length ? pick(HITS)+"\n" + picks.map(p=>`- ${p.e.title}${p.phone}: ${p.text}`).join("\n") : `${pick(MISS)}${cfg().askContact? " Please check with "+cfg().askContact+".":""}`;
  S.answer = {q, text, ids: [...new Set(picks.map(p=>p.e.id))].slice(0,4), status:"done", quick:true, note: note||""}; logAsk(S.answer); render();
}

  const tb = t.closest(".tab, .mgmtnote [data-tab]"); if (tb){ S.tab = tb.dataset.tab; S.q=""; $("#q").value=""; S.editingId=null; S.movingId=null; S.renaming=null; render(); return; }

(async ()=>{

  if (!db){ S.db = false; render(); return; }
  S.db = db;
  if (user){ S.canEdit = await user.canEdit(); S.isAdmin = S.canEdit; S.myId = await user.id(); try { S.canWrite = await user.can("data.write"); } catch(e){ S.canWrite = null; } } else S.canWrite = null;
  if (!S.canEdit && S.myId && S.canWrite !== true) db.doc("quizAccess/"+S.myId).onSnapshot(sn=>{ S.quizUnlocked = sn.exists && !!(sn.data()||{}).on; safeRender(); }, ()=>{});
  if (S.canEdit) db.collection("quizAccess").limit(500).onSnapshot(sn=>{ S.quizAccess = sn.docs.map(d=>({id:d.id, ...d.data()})).filter(x=>x.on); safeRender(); }, ()=>{});
  db.doc("config/hub").onSnapshot(s=>{ S.config = s.exists ? s.data() : null; S.loaded.config = true; if (!S.meName && knownName(S.myId)) S.meName = knownName(S.myId); applyRole(); applyOcEdits(); safeRender(); }, ()=>{});
  db.collection("oncallEdits").limit(100).onSnapshot(sn=>{ S.ocEdits = sn.docs.map(d=>({id:d.id, ...d.data()})); applyOcEdits(); safeRender(); }, ()=>{});
  db.collection("entries").limit(1000).onSnapshot(s=>{ const m = new Map(); s.docs.forEach(d=>{ const old = S.entries.get(d.id); const v = {id:d.id, ...d.data()}; if (old && old.updatedAt===v.updatedAt){ v._h=old._h; v._hv=old._hv; v._t=old._t; v._x=old._x; v._d=old._d; } m.set(d.id, v); }); S.rawEntries = m; applyOcEdits(); S.loaded.entries = true; safeRender(); }, ()=>{ S.db=false; render(); });
  capSub();
  db.collection("trainingSignoffs").limit(500).onSnapshot(sn=>{ const m = {}; sn.docs.forEach(d=>{ m[d.id] = d.data(); }); S.signoffs = m; safeRender(); }, ()=>{});
  if (!S.canEdit && S.myId) db.doc("quizResults/"+S.myId).onSnapshot(sn=>{ S.myQuizDoc = sn.exists? sn.data() : null; safeRender(); }, ()=>{});
  if (S.canEdit){

    db.doc("data/users/"+S.myId+"/quizseen").get().then(sn=>{ if (sn.exists) S.quizSeenAt = sn.data().at || ""; safeRender(); }).catch(()=>{});
  }
  if (S.canEdit){ 
    db.collection("questions").limit(500).onSnapshot(sn=>{ const before = new Set(allQItems().map(x=>x.id)); S.allQs = sn.docs.map(d=>({id:d.id, ...d.data()}));
      S.mqLoaded = true; maybeMgrPop(); safeRender(); }, ()=>{ S.mqLoaded = true; });

    db.collection("answers").limit(500).onSnapshot(sn=>{ const m = {}; sn.docs.forEach(d=>{ m[d.id] = d.data(); }); S.allAns = m; S.maLoaded = true; maybeMgrPop(); safeRender(); }, ()=>{ S.maLoaded = true; });
    db.doc("data/users/"+S.myId+"/qseen").get().then(sn=>{ if (sn.exists) S.mqSeenAt = sn.data().at || ""; }).catch(()=>{}).finally(()=>{ S.mqSeenLoaded = true; maybeMgrPop(); });
